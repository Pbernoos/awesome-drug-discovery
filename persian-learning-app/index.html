<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Learn Persian Alphabet</title>
    <link rel="stylesheet" href="styles.css">
    <link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Noto+Naskh+Arabic:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <h1>Persian Alphabet Journey</h1>
        <p>Click on a letter to start learning!</p>
    </header>

    <main>
        <div id="alphabet-grid" class="grid-container">
            <!-- Letters will be dynamically generated here by JS -->
        </div>
    </main>

    <!-- Modal for immersive letter experience -->
    <div id="letter-modal" class="modal hidden">
        <div class="modal-content">
            <span class="close-btn">&times;</span>

            <div class="modal-header">
                <h2 id="modal-letter" class="big-letter">آ</h2>
                <button id="play-sound-btn" class="action-btn">🔊 Hear it</button>
            </div>

            <div class="modal-body">
                <section class="examples-section">
                    <h3>Examples</h3>
                    <ul id="examples-list">
                        <!-- Examples will be populated here -->
                    </ul>
                </section>

                <section class="quiz-section">
                    <h3>Quick Quiz</h3>
                    <div id="quiz-container">
                        <p id="quiz-question"></p>
                        <div id="quiz-options" class="options-grid">
                            <!-- Options will be populated here -->
                        </div>
                        <p id="quiz-feedback" class="hidden"></p>
                    </div>
                </section>
            </div>
        </div>
    </div>

    <!-- Data script must be loaded before main script -->
    <script src="data.js"></script>
    <script src="script.js"></script>
</body>
</html>
